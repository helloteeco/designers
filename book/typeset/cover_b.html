<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; }
body { width:1600px; height:2560px; overflow:hidden; background:#f6efe1; font-family: Inter; }
.wrap { position:relative; width:1600px; height:2560px; }
.topbar { position:absolute; top:0; left:0; right:0; height:26px; background:#0d2a1f; }
.eyebrow { position:absolute; top:120px; width:100%; text-align:center; font-size:42px; letter-spacing:16px; color:#0d2a1f; font-weight:600; }
.eyerule { position:absolute; top:196px; left:500px; width:600px; border-top:4px solid #e8890c; }
.t1 { position:absolute; top:250px; width:100%; text-align:center; font-family:'Archivo Black'; font-size:305px; color:#131313; letter-spacing:-6px; }
.t2 { position:absolute; top:615px; width:100%; text-align:center; font-family:'Archivo Black'; font-size:222px; color:#e8890c; letter-spacing:-4px; }
.sub { position:absolute; top:950px; width:100%; text-align:center; font-size:54px; line-height:1.5; color:#31302c; }
.chips { position:absolute; top:1160px; width:100%; text-align:center; }
.chips span { display:inline-block; width:84px; height:84px; line-height:84px; margin:0 14px; background:#0d2a1f; color:#f3e9d2; font-family:'Archivo Black'; font-size:44px; border-radius:14px; }
.chips span.mid { background:#e8890c; color:#131313; }
.scene { position:absolute; top:1330px; left:0; }
.authorband { position:absolute; bottom:0; left:0; right:0; height:260px; background:#0d2a1f; }
.author { position:absolute; bottom:0; height:260px; line-height:260px; width:100%; text-align:center; color:#f3e9d2; font-size:60px; letter-spacing:12px; font-weight:600; }
</style></head><body>
<div class="wrap">
  <div class="topbar"></div>

    <path d="M600 200 q15 -15 30 0 M630 200 q15 -15 30 0" stroke="#0d2a1f" stroke-width="6" fill="none" stroke-linecap="round"/>

</div>
</body></html>
